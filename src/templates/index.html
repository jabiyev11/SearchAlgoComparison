<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Search Algorithm Comparison</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: Arial, sans-serif; background: #1a1a2e; color: white; height: 100vh; display: flex; flex-direction: column; }

        header {
            background: #16213e;
            padding: 12px 20px;
            display: flex;
            align-items: center;
            gap: 20px;
            border-bottom: 2px solid #0f3460;
        }
        header h1 { font-size: 18px; color: #e94560; }

        .controls { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
        select, button {
            padding: 7px 14px;
            border-radius: 6px;
            border: none;
            font-size: 14px;
            cursor: pointer;
        }
        select { background: #0f3460; color: white; }
        #btnRun {
            background: #e94560;
            color: white;
            font-weight: bold;
            opacity: 0.5;
            pointer-events: none;
        }
        #btnRun.ready { opacity: 1; pointer-events: all; }
        #btnClear { background: #444; color: white; }

        .instruction {
            font-size: 13px;
            color: #aaa;
            background: #0f3460;
            padding: 5px 12px;
            border-radius: 6px;
        }

        .maps-container {
            display: flex;
            flex: 1;
            gap: 4px;
            padding: 4px;
        }

        .map-panel {
            flex: 1;
            display: flex;
            flex-direction: column;
            border-radius: 8px;
            overflow: hidden;
        }

        .map-label {
            padding: 8px 14px;
            font-weight: bold;
            font-size: 14px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        #label-greedy { background: #c0392b; }
        #label-astar  { background: #2980b9; }

        .stats {
            font-size: 13px;
            font-weight: normal;
            color: rgba(255,255,255,0.85);
        }

        .map { flex: 1; min-height: 0; }
    </style>
</head>
<body>

<header>
    <h1>🗺 Search Algorithm Visualizer</h1>
    <div class="controls">
        <select id="citySelect">
            <option value="baku">Baku, Azerbaijan</option>
            <option value="tbilisi">Tbilisi, Georgia</option>
        </select>
        <span class="instruction" id="instruction">Click map to set START</span>
        <button id="btnRun" onclick="runAlgorithms()">▶ Run</button>
        <button id="btnClear" onclick="clearAll()">✕ Clear</button>
    </div>
</header>

<div class="maps-container">
    <div class="map-panel">
        <div class="map-label" id="label-greedy">
            🔴 Greedy Best-First
            <span class="stats" id="stats-greedy">—</span>
        </div>
        <div class="map" id="map-greedy"></div>
    </div>
    <div class="map-panel">
        <div class="map-label" id="label-astar">
            🔵 A* Search
            <span class="stats" id="stats-astar">—</span>
        </div>
        <div class="map" id="map-astar"></div>
    </div>
</div>

<script>
    // --- State ---
    let startLatLng = null, goalLatLng = null;
    let startMarkers = [], goalMarkers = [], expandedLayers = [[], []], pathLayers = [null, null];
    let activeStreams = [];

    const CITY_CENTERS = {
        baku:    [40.4093, 49.8671],
        tbilisi: [41.6938, 44.8015]
    };

    // --- Init two maps ---
    const maps = [
        L.map('map-greedy').setView(CITY_CENTERS.baku, 12),
        L.map('map-astar').setView(CITY_CENTERS.baku, 12)
    ];

    maps.forEach(m => {
        L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
            attribution: '© OpenStreetMap © CARTO'
        }).addTo(m);
    });

    // Sync zoom and pan between both maps
    function syncMaps(sourceIndex) {
        const source = maps[sourceIndex];
        const target = maps[1 - sourceIndex];
        target.setView(source.getCenter(), source.getZoom(), { animate: false });
    }
    maps[0].on('move', () => syncMaps(0));
    maps[1].on('move', () => syncMaps(1));

    // --- City switch ---
    document.getElementById('citySelect').addEventListener('change', () => {
        clearAll();
        const center = CITY_CENTERS[document.getElementById('citySelect').value];
        maps.forEach(m => m.setView(center, 12));
    });

    // --- Click to place markers ---
    maps.forEach(m => {
        m.on('click', e => {
            if (activeStreams.length > 0) return; // ignore clicks while running

            if (!startLatLng) {
                startLatLng = e.latlng;
                placeMarker(e.latlng, 'start');
                setInstruction('Click map to set GOAL');
            } else if (!goalLatLng) {
                goalLatLng = e.latlng;
                placeMarker(e.latlng, 'goal');
                setInstruction('Ready! Press Run');
                document.getElementById('btnRun').classList.add('ready');
            }
        });
    });

    function placeMarker(latlng, type) {
        const color = type === 'start' ? '#2ecc71' : '#e74c3c';
        const label = type === 'start' ? 'S' : 'G';
        const icon = L.divIcon({
            className: '',
            html: `<div style="background:${color};color:white;width:28px;height:28px;
                   border-radius:50%;display:flex;align-items:center;justify-content:center;
                   font-weight:bold;font-size:13px;border:2px solid white;
                   box-shadow:0 2px 6px rgba(0,0,0,0.4)">${label}</div>`,
            iconSize: [28, 28], iconAnchor: [14, 14]
        });
        maps.forEach(m => {
            const marker = L.marker(latlng, { icon }).addTo(m);
            if (type === 'start') startMarkers.push(marker);
            else goalMarkers.push(marker);
        });
    }

    // --- Run algorithms ---
    function runAlgorithms() {
        if (!startLatLng || !goalLatLng) return;
        document.getElementById('btnRun').classList.remove('ready');
        setInstruction('Running...');

        const city = document.getElementById('citySelect').value;
        const { lat: sLat, lng: sLon } = startLatLng;
        const { lat: gLat, lng: gLon } = goalLatLng;

        document.getElementById('stats-greedy').textContent = 'Running...';
        document.getElementById('stats-astar').textContent  = 'Running...';

        streamAlgo('greedy', 0, city, sLat, sLon, gLat, gLon);
        streamAlgo('astar',  1, city, sLat, sLon, gLat, gLon);
    }

    function streamAlgo(algo, mapIndex, city, sLat, sLon, gLat, gLon) {
        const url = `/stream/${algo}/${city}/${sLat}/${sLon}/${gLat}/${gLon}`;
        const es = new EventSource(url);
        activeStreams.push(es);

        let count = 0;
        const statsEl = document.getElementById(`stats-${algo}`);
        const map = maps[mapIndex];

        es.onmessage = e => {
            const data = JSON.parse(e.data);

            if (data.type === 'expand') {
                count++;
                // Draw expanded node as small circle
                const circle = L.circleMarker([data.lat, data.lon], {
                    radius: 3,
                    color: algo === 'greedy' ? '#e74c3c' : '#3498db',
                    fillOpacity: 0.5,
                    weight: 0
                }).addTo(map);
                expandedLayers[mapIndex].push(circle);

                if (count % 50 === 0) {
                    statsEl.textContent = `Expanding... ${count} nodes`;
                }

            } else if (data.type === 'done') {
                // Draw final path
                const coords = data.path.map(p => [p.lat, p.lon]);
                const pathLine = L.polyline(coords, {
                    color: algo === 'greedy' ? '#ff6b6b' : '#74b9ff',
                    weight: 5,
                    opacity: 0.9
                }).addTo(map);
                pathLayers[mapIndex] = pathLine;
                map.fitBounds(pathLine.getBounds(), { padding: [40, 40] });

                statsEl.textContent = `✅ ${(data.path_length/1000).toFixed(1)}km | ${data.nodes_expanded.toLocaleString()} nodes expanded`;
                setInstruction('Done! Clear to run again.');
                es.close();
                activeStreams = activeStreams.filter(s => s !== es);

            } else if (data.type === 'no_path') {
                statsEl.textContent = '❌ No path found';
                es.close();
                activeStreams = activeStreams.filter(s => s !== es);
            }
        };

        es.onerror = () => {
            es.close();
            activeStreams = activeStreams.filter(s => s !== es);
        };
    }

    // --- Clear ---
    function clearAll() {
        activeStreams.forEach(s => s.close());
        activeStreams = [];
        startLatLng = null; goalLatLng = null;
        startMarkers.forEach(m => { maps[0].removeLayer(m); maps[1].removeLayer(m); });
        goalMarkers.forEach(m =>  { maps[0].removeLayer(m); maps[1].removeLayer(m); });
        startMarkers = []; goalMarkers = [];
        expandedLayers.forEach((layers, i) => {
            layers.forEach(l => maps[i].removeLayer(l));
            expandedLayers[i] = [];
        });
        pathLayers.forEach((l, i) => { if (l) maps[i].removeLayer(l); });
        pathLayers = [null, null];
        document.getElementById('stats-greedy').textContent = '—';
        document.getElementById('stats-astar').textContent  = '—';
        document.getElementById('btnRun').classList.remove('ready');
        setInstruction('Click map to set START');
    }

    function setInstruction(text) {
        document.getElementById('instruction').textContent = text;
    }
</script>
</body>
</html>
